<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Image Stream</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <h1>Live Image Stream</h1>
    <!-- 이미지를 표시할 img 태그 -->
    <img id="stream" src="" alt="Image Stream" style="width: 640px; height: 480px;">

    <script>
        // Socket.IO로 서버에 연결
        var socket = io();

        // 'image_update' 이벤트를 수신
        socket.on('image_update', function(frame) {
            // 콘솔에 수신 메시지를 표시하여 디버깅
            console.log("Received image data!");
            
            // img 태그의 src 속성을 업데이트하여 이미지를 표시
            document.getElementById('stream').src = 'data:image/jpeg;base64,' + frame;
        });

        socket.on('connect', function() {
            console.log("웹소켓이 연결되었어요!");
        });

        socket.on('disconnect', function() {
            console.log("웹소켓 연결이 끊어졌어요!");
        });
    </script>
</body>
</html>
